[project]
name = "n-kb"
version = "0.1.0"
description = "N-KB RAG service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-multipart",
    "httpx",
    "qdrant-client",
    # mcp 2.x 移除了 mcp.server.fastmcp（重命名为 MCPServer），
    # 代码仍按 v1 API 编写，因此必须 pin 到 v1。
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "httpx2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "locals*", "docker*"]
